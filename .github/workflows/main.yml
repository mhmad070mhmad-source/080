name: Extract Spice Data ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' \
            -not -path './.git/*' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Upload the Spice Data ZIP file to the repository first."
            exit 1
          fi

          echo "Extracting: $ZIP_FILE"

          mkdir -p /tmp/spice-data
          unzip -oq "$ZIP_FILE" -d /tmp/spice-data

          SOURCE="/tmp/spice-data"
          COUNT="$(find "$SOURCE" -mindepth 1 -maxdepth 1 | wc -l)"

          if [ "$COUNT" -eq 1 ] && \
             [ -d "$(find "$SOURCE" -mindepth 1 -maxdepth 1 -type d | head -n 1)" ]; then
            SOURCE="$(find "$SOURCE" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          fi

          cp -an "$SOURCE"/. .

      - name: Commit extracted files
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Extract Spice Data project"
            git push
          fi
