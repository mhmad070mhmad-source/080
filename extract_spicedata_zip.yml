
name: Extract Spice Data ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "Spice_Data_GitHub_v1.1.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Spice_Data_GitHub_v1.1.zip"
          TEMP_DIR="_spicedata_extract"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP file not found: $ZIP"
            exit 1
          fi

          rm -rf "$TEMP_DIR"
          mkdir -p "$TEMP_DIR"
          unzip -q "$ZIP" -d "$TEMP_DIR"

          # Remove old project files, preserving Git and workflows.
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "$TEMP_DIR" \
            -exec rm -rf {} +

          # Copy the extracted project into the repository root.
          cp -a "$TEMP_DIR"/. .

          rm -rf "$TEMP_DIR" "$ZIP"

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract Spice Data project [skip ci]"
          git push
          
